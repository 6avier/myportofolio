{% extends 'base.html' %}

{% block title %}Experience - {{ name }}{% endblock %}

{% block content %}
<section class="experience-section" id="experience">
    <div class="container">
        <div class="projects-header">
            <h1 class="section-title ransom-text ransom-ink">Experience</h1>
            {% if user.is_superuser %}
            <a href="{% url 'main:create_experience' %}" class="btn-jelly">+ Add Experience</a>
            {% endif %}
        </div>

        <p id="experience-loading" class="empty-state">Loading experience...</p>
        <p id="experience-error" class="empty-state hide">Failed to load experience. Please try again.</p>
        <p id="experience-empty" class="empty-state hide">Belum ada pengalaman yang ditambahkan.</p>
        <div id="experience-grid" class="experience-grid hide"></div>
    </div>
</section>

<script>
    const EXPERIENCE_ENDPOINT = "{% url 'main:get_experience_json' %}";
    const ID_PLACEHOLDER = "00000000-0000-0000-0000-000000000000";
    const STAR_URL_TEMPLATE = "{% url 'main:toggle_star_experience' '00000000-0000-0000-0000-000000000000' %}";
    const UPDATE_URL_TEMPLATE = "{% url 'main:update_experience' '00000000-0000-0000-0000-000000000000' %}";
    const DELETE_URL_TEMPLATE = "{% url 'main:delete_experience' '00000000-0000-0000-0000-000000000000' %}";
    const CAN_EDIT = {{ can_edit|yesno:'true,false' }};
    const IS_SUPERUSER = {{ user.is_superuser|yesno:'true,false' }};
    const IS_AUTHENTICATED = {{ user.is_authenticated|yesno:'true,false' }};
    const CSRF_TOKEN = "{{ csrf_token }}";

    const experienceGrid = document.getElementById("experience-grid");
    let activeController = null;

    function displayPageSection({ loading = false, error = false, empty = false, grid = false }) {
        document.getElementById("experience-loading").classList.toggle("hide", !loading);
        document.getElementById("experience-error").classList.toggle("hide", !error);
        document.getElementById("experience-empty").classList.toggle("hide", !empty);
        experienceGrid.classList.toggle("hide", !grid);
    }

    function urlFor(template, id) {
        return template.replace(ID_PLACEHOLDER, id);
    }

    function buildExperienceCardElement(experience) {
        const id = experience.id;
        const title = escapeHtml(experience.title);

        const thumbnail = experience.thumbnail
            ? `<img class="experience-thumb" src="${escapeHtml(experience.thumbnail)}" alt="${title} logo">` : "";

        const starTitle = experience.star_count
            ? `Starred by ${escapeHtml(experience.starred_by.join(", "))}` : "Be the first to star this";
        const starForm = IS_AUTHENTICATED ? `
            <form method="post" action="${urlFor(STAR_URL_TEMPLATE, id)}" class="star-form">
                <input type="hidden" name="csrfmiddlewaretoken" value="${CSRF_TOKEN}">
                <button type="submit"
                        class="button button-star${experience.is_starred ? " is-starred" : ""}"
                        title="${starTitle}">
                    <span aria-hidden="true">★</span>
                    ${experience.is_starred ? "Unstar" : "Star"}
                    <span class="star-count">${experience.star_count}</span>
                </button>
            </form>` : "";

        const deleteButton = IS_SUPERUSER ? `
            <button type="button" class="button button-danger"
                    popovertarget="delete-experience-${id}"
                    aria-label="Delete ${title}" title="Delete experience">Delete</button>` : "";
        const editLink = CAN_EDIT
            ? `<a href="${urlFor(UPDATE_URL_TEMPLATE, id)}" class="button button-secondary">Edit</a>` : "";
        const actions = CAN_EDIT ? `<p class="experience-status">${deleteButton}${editLink}</p>` : "";

        const deleteModal = IS_SUPERUSER ? `
            <div id="delete-experience-${id}" class="project-delete-modal" popover="auto"
                 role="dialog" aria-modal="true" aria-labelledby="delete-experience-title-${id}">
                <button type="button" class="project-delete-modal__backdrop"
                        popovertarget="delete-experience-${id}" popovertargetaction="hide"
                        aria-label="Close delete confirmation"></button>
                <div class="project-delete-modal__content">
                    <button type="button" class="project-delete-modal__close"
                            popovertarget="delete-experience-${id}" popovertargetaction="hide"
                            aria-label="Close delete confirmation">×</button>
                    <h2 id="delete-experience-title-${id}">Delete Experience?</h2>
                    <p>Are you sure you want to delete <strong>${title}</strong>?</p>
                    <div class="project-delete-modal__actions">
                        <button type="button" class="button button-secondary"
                                popovertarget="delete-experience-${id}" popovertargetaction="hide">Cancel</button>
                        <form method="post" action="${urlFor(DELETE_URL_TEMPLATE, id)}">
                            <input type="hidden" name="csrfmiddlewaretoken" value="${CSRF_TOKEN}">
                            <button type="submit" class="button button-danger">Yes, Delete</button>
                        </form>
                    </div>
                </div>
            </div>` : "";

        const card = document.createElement("article");
        card.className = "experience-card";
        card.innerHTML = `
            ${thumbnail}
            <span class="experience-category">${escapeHtml(experience.category_display)}</span>
            <h2>${title}</h2>
            <p class="experience-description">${escapeHtml(experience.description)}</p>
            <p class="experience-status">${experience.is_ongoing ? "Ongoing" : "Completed"}</p>
            ${starForm}
            ${actions}
            ${deleteModal}`;
        return card;
    }

    async function fetchExperience() {
        if (activeController) activeController.abort();
        activeController = new AbortController();

        displayPageSection({ loading: true });
        try {
            const response = await fetch(EXPERIENCE_ENDPOINT, { signal: activeController.signal });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const items = await response.json();

            experienceGrid.innerHTML = "";
            items.forEach((item) => experienceGrid.appendChild(buildExperienceCardElement(item)));
            displayPageSection(items.length ? { grid: true } : { empty: true });
        } catch (err) {
            if (err.name === "AbortError") return;
            displayPageSection({ error: true });
        }
    }

    fetchExperience();
</script>
{% endblock %}
